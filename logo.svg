<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="64" height="64">
  <defs>
    <!-- Ghana flag gradient -->
    <linearGradient id="ghanaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CE1126"/>
      <stop offset="33%" style="stop-color:#CE1126"/>
      <stop offset="33%" style="stop-color:#FCD116"/>
      <stop offset="66%" style="stop-color:#FCD116"/>
      <stop offset="66%" style="stop-color:#006B3F"/>
      <stop offset="100%" style="stop-color:#006B3F"/>
    </linearGradient>
    <!-- Gold shine -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FCD116"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle with Ghana colors -->
  <circle cx="256" cy="256" r="240" fill="#CE1126"/>
  <circle cx="256" cy="256" r="200" fill="#FCD116"/>
  <circle cx="256" cy="256" r="160" fill="#006B3F"/>
  
  <!-- Inner dark circle for contrast -->
  <circle cx="256" cy="256" r="130" fill="#1a1a2e"/>
  
  <!-- Black star of Ghana (5-pointed) -->
  <polygon 
    points="256,100 273,170 345,170 287,215 308,285 256,245 204,285 225,215 167,170 239,170" 
    fill="#000000"
    transform="translate(0, 30) scale(0.6) translate(170, 120)"
  />
  
  <!-- Sigma symbol (Σ) - main math symbol -->
  <text x="256" y="300" 
        font-family="Georgia, serif" 
        font-size="200" 
        font-weight="bold"
        fill="url(#goldShine)" 
        text-anchor="middle" 
        filter="url(#shadow)">Σ</text>
  
  <!-- Pi symbol (π) - small accent -->
  <text x="340" y="180" 
        font-family="Georgia, serif" 
        font-size="50" 
        font-weight="bold"
        fill="#FCD116" 
        text-anchor="middle">π</text>
  
  <!-- Square root symbol - small accent -->
  <text x="175" y="175" 
        font-family="Georgia, serif" 
        font-size="45" 
        fill="#FCD116" 
        text-anchor="middle">√</text>
  
  <!-- Plus/equals accents -->
  <text x="155" y="340" 
        font-family="Arial, sans-serif" 
        font-size="35" 
        font-weight="bold"
        fill="#CE1126" 
        text-anchor="middle">+</text>
  
  <text x="360" y="350" 
        font-family="Arial, sans-serif" 
        font-size="35" 
        font-weight="bold"
        fill="#006B3F" 
        text-anchor="middle">=</text>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#FCD116" stroke-width="6"/>
  <circle cx="256" cy="256" r="254" fill="none" stroke="#000" stroke-width="2"/>
</svg>
