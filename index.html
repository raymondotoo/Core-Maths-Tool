<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Mathematics - WASSCE Prep</title>
    
    <!-- App Icons & Theme -->
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta name="theme-color" content="#CE1126">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Core Mathematics tutorial for WASSCE preparation. Complete chapters with examples and solutions.">
    
    <!-- Preconnect for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    
    <!-- Critical CSS inline for instant render -->
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; }
        .loading-splash { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #CE1126 0%, #FCD116 50%, #006B3F 100%); }
        .loading-splash h1 { color: #fff; font-size: 2rem; margin-bottom: 1rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .loading-splash img { width: 120px; height: 120px; margin-bottom: 1rem; }
        .loading-spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #FCD116; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .container { display: none; }
        .container.loaded { display: block; }
    </style>
    
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Fonts loaded async to not block render -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"></noscript>
</head>
<body>
    <!-- Floating Toolbar -->
    <div class="floating-toolbar" id="floatingToolbar">
        <button class="toolbar-btn" id="darkModeToggle" title="Toggle Dark Mode" aria-label="Toggle dark mode">
            <span class="icon-light">🌙</span>
            <span class="icon-dark">☀️</span>
        </button>
        <button class="toolbar-btn" id="fontDecrease" title="Decrease Font Size" aria-label="Decrease font size">A-</button>
        <button class="toolbar-btn" id="fontIncrease" title="Increase Font Size" aria-label="Increase font size">A+</button>
        <button class="toolbar-btn" id="backToTop" title="Back to Top" aria-label="Scroll to top">↑</button>
    </div>

    <!-- Reading Progress Bar -->
    <div class="reading-progress-bar" id="readingProgress"></div>

    <!-- Loading Splash Screen -->
    <div class="loading-splash" id="loadingSplash">
        <img src="logo.svg" alt="Core Maths Logo">
        <h1>Core Mathematics</h1>
        <div class="loading-spinner"></div>
        <p style="margin-top: 1rem; color: rgba(255,255,255,0.8);">WASSCE Preparation</p>
    </div>

    <div class="container" id="mainContainer">
        <header>
            <h1><img src="logo.svg" alt="" class="header-logo"> Core Mathematics</h1>
            <nav>
                <ul>
                    <!-- Chapter links 1–39 are injected dynamically from data/chapters/index.csv by script.js -->
                </ul>
            </nav>
        </header>

        <div class="layout">
            <aside id="toc-panel">
                <h2 class="toc-title">Contents</h2>
                <div id="toc-body"></div>
            </aside>

            <main>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div id="progress-fill"></div>
                    </div>
                    <span id="progress-text">Loading chapters...</span>
                </div>

                <!-- Chapters 1–39 are injected dynamically from data/chapters/index.csv by script.js -->
            </main>
        </div>
    </div>

    <!-- Scripts loaded at end with defer for performance -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="script.js" defer></script>
    
    <!-- MathJax loaded last, async with optimized config -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: false,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                ignoreHtmlClass: 'no-mathjax',
                renderActions: {
                    addMenu: []  // Disable context menu for faster render
                }
            },
            startup: {
                typeset: false,
                ready: () => {
                    MathJax.startup.defaultReady();
                    console.log('MathJax ready');
                }
            },
            svg: {
                fontCache: 'global'  // Share font cache across equations
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
