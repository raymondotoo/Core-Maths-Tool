<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Mathematics Tutorial</title>
    <!-- Modern fonts for better math readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Include MathJax for rendering mathematical notation -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Markdown renderer for loading chapter .md files dynamically -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Core Mathematics</h1>
            <nav>
                <ul>
                    <!-- Chapter links 1–39 are injected dynamically from data/chapters/index.csv by script.js -->
                </ul>
            </nav>
        </header>

        <div class="layout">
            <aside id="toc-panel">
                <h2 class="toc-title">Contents</h2>
                <div id="toc-body"></div>
            </aside>

            <main>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div id="progress-fill"></div>
                    </div>
                    <span id="progress-text">Loading chapters...</span>
                </div>

                <!-- Chapters 1–39 are injected dynamically from data/chapters/index.csv by script.js -->
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
