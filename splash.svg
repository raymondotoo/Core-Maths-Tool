<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CE1126"/>
      <stop offset="50%" style="stop-color:#FCD116"/>
      <stop offset="100%" style="stop-color:#006B3F"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="2732" height="2732" fill="url(#bg)"/>
  
  <!-- Logo centered - scaled up from 120 viewBox to fit well in center -->
  <g transform="translate(1366, 1366)">
    <!-- Outer ring (red) -->
    <circle cx="0" cy="0" r="400" fill="none" stroke="#CE1126" stroke-width="48"/>
    
    <!-- Middle ring (gold) -->
    <circle cx="0" cy="0" r="320" fill="none" stroke="#FCD116" stroke-width="40"/>
    
    <!-- Inner ring (green) -->
    <circle cx="0" cy="0" r="248" fill="none" stroke="#006B3F" stroke-width="32"/>
    
    <!-- Center fill -->
    <circle cx="0" cy="0" r="216" fill="#ffffff"/>
    
    <!-- Black star (Ghana symbol) -->
    <polygon points="0,-96 28,-32 96,-32 40,12 60,80 0,40 -60,80 -40,12 -96,-32 -28,-32" fill="#000000"/>
    
    <!-- Gold sigma (math symbol) -->
    <text x="0" y="180" text-anchor="middle" font-family="Times New Roman, serif" font-size="180" font-weight="bold" fill="#FCD116">Σ</text>
    
    <!-- Small pi and root symbols as accents -->
    <text x="-160" y="60" font-family="Times New Roman, serif" font-size="80" fill="#006B3F" opacity="0.7">π</text>
    <text x="160" y="60" font-family="Times New Roman, serif" font-size="80" fill="#CE1126" opacity="0.7">√</text>
  </g>
  
  <!-- App title -->
  <text x="1366" y="2100" text-anchor="middle" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="#ffffff">Core Mathematics</text>
  <text x="1366" y="2200" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" fill="#ffffff" opacity="0.9">WASSCE Prep</text>
</svg>
