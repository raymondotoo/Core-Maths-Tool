<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 300">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eee" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="350" height="300" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="50" y1="250" x2="320" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="250" x2="50" y2="30" stroke="#333" stroke-width="2"/>
  
  <!-- Axis arrows -->
  <polygon points="320,250 310,245 310,255" fill="#333"/>
  <polygon points="50,30 45,40 55,40" fill="#333"/>
  
  <!-- Axis labels -->
  <text x="330" y="255" font-family="Arial" font-size="14" fill="#333">x</text>
  <text x="40" y="25" font-family="Arial" font-size="14" fill="#333">y</text>
  <text x="40" y="265" font-family="Arial" font-size="12" fill="#333">O</text>
  
  <!-- Grid numbers on x-axis -->
  <text x="90" y="265" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">1</text>
  <text x="130" y="265" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">2</text>
  <text x="170" y="265" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">3</text>
  <text x="210" y="265" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">4</text>
  <text x="250" y="265" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">5</text>
  
  <!-- Grid numbers on y-axis -->
  <text x="38" y="214" font-family="Arial" font-size="11" fill="#666" text-anchor="end">1</text>
  <text x="38" y="174" font-family="Arial" font-size="11" fill="#666" text-anchor="end">2</text>
  <text x="38" y="134" font-family="Arial" font-size="11" fill="#666" text-anchor="end">3</text>
  <text x="38" y="94" font-family="Arial" font-size="11" fill="#666" text-anchor="end">4</text>
  <text x="38" y="54" font-family="Arial" font-size="11" fill="#666" text-anchor="end">5</text>
  
  <!-- Position vector to P(3, 5) -->
  <line x1="50" y1="250" x2="170" y2="50" stroke="#4285f4" stroke-width="3"/>
  
  <!-- Arrow head -->
  <polygon points="170,50 160,65 173,62" fill="#4285f4"/>
  
  <!-- Point P -->
  <circle cx="170" cy="50" r="5" fill="#ea4335"/>
  <text x="185" y="50" font-family="Arial" font-size="14" fill="#ea4335" font-weight="bold">P(3, 5)</text>
  
  <!-- Dashed lines to coordinates -->
  <line x1="170" y1="50" x2="170" y2="250" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="170" y1="50" x2="50" y2="50" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- Vector label -->
  <text x="95" y="140" font-family="Arial" font-size="14" fill="#4285f4" font-weight="bold" transform="rotate(-59, 95, 140)">OP</text>
  
  <!-- Column vector notation -->
  <text x="250" y="140" font-family="Arial" font-size="14" fill="#333">
    <tspan font-weight="bold">OP</tspan> = 
  </text>
  <text x="290" y="125" font-family="Arial" font-size="14" fill="#4285f4">(3)</text>
  <text x="290" y="155" font-family="Arial" font-size="14" fill="#4285f4">(5)</text>
  <line x1="285" y1="115" x2="285" y2="165" stroke="#4285f4" stroke-width="1.5"/>
  <line x1="310" y1="115" x2="310" y2="165" stroke="#4285f4" stroke-width="1.5"/>
  
  <!-- Title -->
  <text x="175" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Position Vector from Origin to Point P</text>
</svg>