<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eee" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="320" height="280" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="40" y1="220" x2="280" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="40" y1="220" x2="40" y2="40" stroke="#333" stroke-width="2"/>
  
  <!-- Axis arrows -->
  <polygon points="280,220 270,215 270,225" fill="#333"/>
  <polygon points="40,40 35,50 45,50" fill="#333"/>
  
  <!-- Labels -->
  <text x="285" y="225" font-family="Arial" font-size="12" fill="#333">x</text>
  <text x="35" y="35" font-family="Arial" font-size="12" fill="#333">y</text>
  <text x="30" y="235" font-family="Arial" font-size="11" fill="#333">O</text>
  
  <!-- Grid marks -->
  <text x="80" y="235" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">1</text>
  <text x="120" y="235" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">2</text>
  <text x="160" y="235" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">3</text>
  <text x="200" y="235" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">4</text>
  
  <text x="28" y="184" font-family="Arial" font-size="10" fill="#666" text-anchor="end">1</text>
  <text x="28" y="144" font-family="Arial" font-size="10" fill="#666" text-anchor="end">2</text>
  <text x="28" y="104" font-family="Arial" font-size="10" fill="#666" text-anchor="end">3</text>
  <text x="28" y="64" font-family="Arial" font-size="10" fill="#666" text-anchor="end">4</text>
  
  <!-- Vector (3, 4) -->
  <line x1="40" y1="220" x2="160" y2="60" stroke="#4285f4" stroke-width="3"/>
  <polygon points="160,60 148,72 156,77" fill="#4285f4"/>
  
  <!-- Point -->
  <circle cx="160" cy="60" r="4" fill="#ea4335"/>
  
  <!-- Horizontal component -->
  <line x1="40" y1="220" x2="160" y2="220" stroke="#34a853" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="100" y="245" font-family="Arial" font-size="12" fill="#34a853" text-anchor="middle">3 (x-component)</text>
  
  <!-- Vertical component -->
  <line x1="160" y1="220" x2="160" y2="60" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="185" y="140" font-family="Arial" font-size="12" fill="#9c27b0">4</text>
  <text x="190" y="155" font-family="Arial" font-size="10" fill="#9c27b0">(y-comp)</text>
  
  <!-- Right angle marker -->
  <polyline points="145,220 145,205 160,205" fill="none" stroke="#666" stroke-width="1"/>
  
  <!-- Vector label and magnitude -->
  <text x="80" y="130" font-family="Arial" font-size="14" fill="#4285f4" font-weight="bold" transform="rotate(-53, 80, 130)">|a| = 5</text>
  
  <!-- Formula box -->
  <rect x="200" y="50" width="110" height="55" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="210" y="70" font-family="Arial" font-size="11" fill="#333" font-weight="bold">a = (3, 4)</text>
  <text x="210" y="90" font-family="Arial" font-size="11" fill="#333">|a| = √(3² + 4²)</text>
  <text x="210" y="105" font-family="Arial" font-size="11" fill="#4285f4" font-weight="bold">|a| = √25 = 5</text>
  
  <!-- Title -->
  <text x="160" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Magnitude of a Vector</text>
</svg>