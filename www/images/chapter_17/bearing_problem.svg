<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 320">
  <!-- North arrows at each point -->
  <!-- At A -->
  <line x1="80" y1="260" x2="80" y2="200" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="80" y="190" font-family="Arial" font-size="10" text-anchor="middle" fill="#999">N</text>
  
  <!-- At B -->
  <line x1="80" y1="100" x2="80" y2="40" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="80" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#999">N</text>
  
  <!-- First leg: A to B (100 km North) -->
  <line x1="80" y1="260" x2="80" y2="100" stroke="#4285f4" stroke-width="3"/>
  <polygon points="80,100 74,115 86,115" fill="#4285f4"/>
  <text x="50" y="180" font-family="Arial" font-size="13" fill="#4285f4" font-weight="bold">100 km</text>
  
  <!-- Second leg: B to C (100 km East) -->
  <line x1="80" y1="100" x2="240" y2="100" stroke="#ea4335" stroke-width="3"/>
  <polygon points="240,100 225,94 225,106" fill="#ea4335"/>
  <text x="160" y="90" font-family="Arial" font-size="13" fill="#ea4335" font-weight="bold">100 km</text>
  
  <!-- Resultant: A to C -->
  <line x1="80" y1="260" x2="240" y2="100" stroke="#34a853" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="175" y="200" font-family="Arial" font-size="14" fill="#34a853" font-weight="bold">d = ?</text>
  
  <!-- Points -->
  <circle cx="80" cy="260" r="5" fill="#333"/>
  <text x="65" y="280" font-family="Arial" font-size="14" fill="#333" font-weight="bold">A</text>
  <text x="50" y="295" font-family="Arial" font-size="11" fill="#666">(Start)</text>
  
  <circle cx="80" cy="100" r="4" fill="#666"/>
  <text x="65" y="115" font-family="Arial" font-size="14" fill="#666" font-weight="bold">B</text>
  
  <circle cx="240" cy="100" r="5" fill="#333"/>
  <text x="250" y="105" font-family="Arial" font-size="14" fill="#333" font-weight="bold">C</text>
  <text x="250" y="118" font-family="Arial" font-size="11" fill="#666">(End)</text>
  
  <!-- Bearing angle at A -->
  <path d="M 80,220 A 40 40 0 0 1 108,232" fill="none" stroke="#9c27b0" stroke-width="2"/>
  <text x="105" y="210" font-family="Arial" font-size="14" fill="#9c27b0" font-weight="bold">θ = ?</text>
  
  <!-- Right angle at B -->
  <polyline points="80,115 95,115 95,100" fill="none" stroke="#666" stroke-width="1"/>
  
  <!-- Legend -->
  <rect x="260" y="150" width="80" height="80" fill="rgba(255,255,255,0.9)" stroke="#ddd" rx="3"/>
  <text x="270" y="170" font-family="Arial" font-size="11" fill="#333" font-weight="bold">Find:</text>
  <text x="270" y="190" font-family="Arial" font-size="11" fill="#34a853">d = √(100² + 100²)</text>
  <text x="270" y="210" font-family="Arial" font-size="11" fill="#9c27b0">θ = tan⁻¹(100/100)</text>
  
  <!-- Title -->
  <text x="175" y="20" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">Bearing Problem: Distance and Direction</text>
</svg>