<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 260">
  <!-- Circle -->
  <circle cx="175" cy="120" r="80" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Diameter AB -->
  <line x1="95" y1="120" x2="255" y2="120" stroke="#ea4335" stroke-width="3"/>
  
  <!-- Points A and B -->
  <circle cx="95" cy="120" r="4" fill="#333"/>
  <text x="80" y="125" font-family="Arial" font-size="12" fill="#333" font-weight="bold">A</text>
  
  <circle cx="255" cy="120" r="4" fill="#333"/>
  <text x="265" y="125" font-family="Arial" font-size="12" fill="#333" font-weight="bold">B</text>
  
  <!-- Point C on circle (top) -->
  <circle cx="175" cy="40" r="4" fill="#333"/>
  <text x="175" y="28" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">C</text>
  
  <!-- Lines AC and BC -->
  <line x1="95" y1="120" x2="175" y2="40" stroke="#4285f4" stroke-width="2"/>
  <line x1="255" y1="120" x2="175" y2="40" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Right angle at C -->
  <rect x="165" y="50" width="12" height="12" fill="none" stroke="#34a853" stroke-width="2"/>
  <text x="200" y="55" font-family="Arial" font-size="14" fill="#34a853" font-weight="bold">90°</text>
  
  <!-- Center point -->
  <circle cx="175" cy="120" r="3" fill="#333"/>
  <text x="175" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">O</text>
  
  <!-- Formula -->
  <rect x="70" y="215" width="210" height="35" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="175" y="235" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Angle in a Semicircle = 90°</text>
  <text x="175" y="248" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">If AB is diameter, angle ACB = 90°</text>
</svg>