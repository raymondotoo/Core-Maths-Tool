<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280">
  <!-- Circle -->
  <circle cx="140" cy="130" r="70" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Center O -->
  <circle cx="140" cy="130" r="3" fill="#333"/>
  <text x="130" y="135" font-family="Arial" font-size="12" fill="#333" font-weight="bold">O</text>
  
  <!-- Point of tangency P -->
  <circle cx="210" cy="130" r="4" fill="#ea4335"/>
  <text x="220" y="125" font-family="Arial" font-size="12" fill="#333" font-weight="bold">P</text>
  
  <!-- Radius OP -->
  <line x1="140" y1="130" x2="210" y2="130" stroke="#4285f4" stroke-width="2"/>
  <text x="175" y="145" font-family="Arial" font-size="11" fill="#4285f4" font-weight="bold">5 cm</text>
  
  <!-- Tangent line (vertical) -->
  <line x1="210" y1="50" x2="210" y2="210" stroke="#ea4335" stroke-width="2"/>
  
  <!-- Right angle at P -->
  <rect x="195" y="130" width="12" height="12" fill="none" stroke="#34a853" stroke-width="2"/>
  
  <!-- External point T -->
  <circle cx="210" cy="50" r="4" fill="#333"/>
  <text x="220" y="55" font-family="Arial" font-size="12" fill="#333" font-weight="bold">T</text>
  
  <!-- Line OT (dashed) -->
  <line x1="140" y1="130" x2="210" y2="50" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="155" y="80" font-family="Arial" font-size="11" fill="#333" font-weight="bold">13 cm</text>
  
  <!-- PT label -->
  <text x="225" y="95" font-family="Arial" font-size="12" fill="#9c27b0" font-weight="bold">PT = ?</text>
  
  <!-- Formula box -->
  <rect x="230" y="130" width="115" height="80" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="287" y="148" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">Tangent ⊥ Radius</text>
  <text x="240" y="165" font-family="Arial" font-size="10" fill="#333">PT² + 5² = 13²</text>
  <text x="240" y="180" font-family="Arial" font-size="10" fill="#333">PT² = 169 - 25</text>
  <text x="240" y="195" font-family="Arial" font-size="11" fill="#34a853" font-weight="bold">PT = 12 cm</text>
  
  <!-- Title -->
  <text x="175" y="255" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">Tangent and Radius</text>
</svg>