<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280">
  <!-- Circle -->
  <circle cx="175" cy="130" r="85" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Cyclic quadrilateral ABCD -->
  <polygon points="115,65 250,85 230,195 95,175" fill="rgba(66, 133, 244, 0.1)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Vertices -->
  <circle cx="115" cy="65" r="4" fill="#333"/>
  <text x="100" y="55" font-family="Arial" font-size="12" fill="#333" font-weight="bold">A</text>
  
  <circle cx="250" cy="85" r="4" fill="#333"/>
  <text x="260" y="80" font-family="Arial" font-size="12" fill="#333" font-weight="bold">B</text>
  
  <circle cx="230" cy="195" r="4" fill="#333"/>
  <text x="240" y="205" font-family="Arial" font-size="12" fill="#333" font-weight="bold">C</text>
  
  <circle cx="95" cy="175" r="4" fill="#333"/>
  <text x="75" y="180" font-family="Arial" font-size="12" fill="#333" font-weight="bold">D</text>
  
  <!-- Angle markers and values -->
  <!-- Angle A = 85° -->
  <path d="M 130,77 A 15 15 0 0 1 123,83" fill="none" stroke="#ea4335" stroke-width="2"/>
  <text x="135" y="72" font-family="Arial" font-size="11" fill="#ea4335" font-weight="bold">85°</text>
  
  <!-- Angle B = 100° -->
  <path d="M 235,93 A 15 15 0 0 0 240,105" fill="none" stroke="#4285f4" stroke-width="2"/>
  <text x="220" y="100" font-family="Arial" font-size="11" fill="#4285f4" font-weight="bold">100°</text>
  
  <!-- Angle C = 95° (opposite to A) -->
  <path d="M 218,185 A 15 15 0 0 0 225,175" fill="none" stroke="#ea4335" stroke-width="2"/>
  <text x="205" y="195" font-family="Arial" font-size="11" fill="#ea4335" font-weight="bold">95°</text>
  
  <!-- Angle D = 80° (opposite to B) -->
  <path d="M 108,165 A 15 15 0 0 1 105,155" fill="none" stroke="#4285f4" stroke-width="2"/>
  <text x="115" y="165" font-family="Arial" font-size="11" fill="#4285f4" font-weight="bold">80°</text>
  
  <!-- Center -->
  <circle cx="175" cy="130" r="2" fill="#666"/>
  
  <!-- Formula -->
  <rect x="60" y="235" width="230" height="40" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="175" y="252" font-family="Arial" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">Opposite angles sum to 180°</text>
  <text x="175" y="268" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">A + C = 85° + 95° = 180° | B + D = 100° + 80° = 180°</text>
</svg>