<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 300">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#eee" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="350" height="300" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="50" y1="250" x2="310" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="250" x2="50" y2="40" stroke="#333" stroke-width="2"/>
  
  <!-- Arrows -->
  <polygon points="310,250 300,245 300,255" fill="#333"/>
  <polygon points="50,40 45,50 55,50" fill="#333"/>
  
  <!-- Labels -->
  <text x="315" y="255" font-family="Arial" font-size="12" fill="#333">x</text>
  <text x="45" y="35" font-family="Arial" font-size="12" fill="#333">y</text>
  
  <!-- Grid marks -->
  <text x="85" y="265" font-family="Arial" font-size="10" fill="#666">1</text>
  <text x="120" y="265" font-family="Arial" font-size="10" fill="#666">2</text>
  <text x="155" y="265" font-family="Arial" font-size="10" fill="#666">3</text>
  <text x="190" y="265" font-family="Arial" font-size="10" fill="#666">4</text>
  <text x="225" y="265" font-family="Arial" font-size="10" fill="#666">5</text>
  <text x="260" y="265" font-family="Arial" font-size="10" fill="#666">6</text>
  
  <text x="38" y="218" font-family="Arial" font-size="10" fill="#666">1</text>
  <text x="38" y="183" font-family="Arial" font-size="10" fill="#666">2</text>
  <text x="38" y="148" font-family="Arial" font-size="10" fill="#666">3</text>
  <text x="38" y="113" font-family="Arial" font-size="10" fill="#666">4</text>
  <text x="38" y="78" font-family="Arial" font-size="10" fill="#666">5</text>
  <text x="38" y="63" font-family="Arial" font-size="10" fill="#666">6</text>
  
  <!-- Point P(2, 3) -->
  <circle cx="120" cy="145" r="5" fill="#4285f4"/>
  <text x="100" y="135" font-family="Arial" font-size="12" fill="#4285f4" font-weight="bold">P(2, 3)</text>
  
  <!-- Point Q(5, 7) -->
  <circle cx="225" cy="75" r="5" fill="#ea4335"/>
  <text x="235" y="70" font-family="Arial" font-size="12" fill="#ea4335" font-weight="bold">Q(5, 7)</text>
  
  <!-- Distance line PQ -->
  <line x1="120" y1="145" x2="225" y2="75" stroke="#34a853" stroke-width="3"/>
  <text x="185" y="125" font-family="Arial" font-size="14" fill="#34a853" font-weight="bold">d = ?</text>
  
  <!-- Right triangle -->
  <line x1="120" y1="145" x2="225" y2="145" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="225" y1="145" x2="225" y2="75" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Component labels -->
  <text x="165" y="160" font-family="Arial" font-size="11" fill="#9c27b0">3 (5-2)</text>
  <text x="235" y="115" font-family="Arial" font-size="11" fill="#9c27b0">4 (7-3)</text>
  
  <!-- Right angle marker -->
  <polyline points="210,145 210,130 225,130" fill="none" stroke="#666" stroke-width="1"/>
  
  <!-- Formula -->
  <rect x="50" y="270" width="250" height="25" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="175" y="287" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">d = √[(5-2)² + (7-3)²] = √(9+16) = √25 = 5</text>
</svg>