<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#eee" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="350" height="280" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="40" y1="230" x2="310" y2="230" stroke="#333" stroke-width="2"/>
  <line x1="40" y1="230" x2="40" y2="30" stroke="#333" stroke-width="2"/>
  
  <!-- Arrows -->
  <polygon points="310,230 300,225 300,235" fill="#333"/>
  <polygon points="40,30 35,40 45,40" fill="#333"/>
  
  <!-- Labels -->
  <text x="315" y="235" font-family="Arial" font-size="12" fill="#333">x</text>
  <text x="35" y="25" font-family="Arial" font-size="12" fill="#333">y</text>
  
  <!-- Grid marks -->
  <text x="70" y="245" font-family="Arial" font-size="9" fill="#666">1</text>
  <text x="100" y="245" font-family="Arial" font-size="9" fill="#666">2</text>
  <text x="130" y="245" font-family="Arial" font-size="9" fill="#666">3</text>
  <text x="160" y="245" font-family="Arial" font-size="9" fill="#666">4</text>
  <text x="190" y="245" font-family="Arial" font-size="9" fill="#666">5</text>
  <text x="220" y="245" font-family="Arial" font-size="9" fill="#666">6</text>
  <text x="250" y="245" font-family="Arial" font-size="9" fill="#666">7</text>
  <text x="280" y="245" font-family="Arial" font-size="9" fill="#666">8</text>
  
  <text x="30" y="203" font-family="Arial" font-size="9" fill="#666">1</text>
  <text x="30" y="173" font-family="Arial" font-size="9" fill="#666">2</text>
  <text x="30" y="143" font-family="Arial" font-size="9" fill="#666">3</text>
  <text x="30" y="113" font-family="Arial" font-size="9" fill="#666">4</text>
  <text x="30" y="83" font-family="Arial" font-size="9" fill="#666">5</text>
  <text x="30" y="53" font-family="Arial" font-size="9" fill="#666">6</text>
  
  <!-- Point A(2, 5) -->
  <circle cx="100" cy="80" r="5" fill="#4285f4"/>
  <text x="60" y="75" font-family="Arial" font-size="12" fill="#4285f4" font-weight="bold">A(2, 5)</text>
  
  <!-- Point B(8, 11) - scale y as 11 would be (11-5)*30 = 180 above 5 position, but let's position it reasonably -->
  <!-- Actually, let's use points that fit nicely: A(2, 2) and B(8, 6), M(5, 4) -->
  
  <!-- Line AB -->
  <line x1="100" y1="170" x2="280" y2="50" stroke="#999" stroke-width="2"/>
  
  <!-- Point A(2, 2) -->
  <circle cx="100" cy="170" r="5" fill="#4285f4"/>
  <text x="65" y="185" font-family="Arial" font-size="12" fill="#4285f4" font-weight="bold">A(2, 2)</text>
  
  <!-- Point B(8, 6) adjusted -->
  <circle cx="280" cy="50" r="5" fill="#ea4335"/>
  <text x="255" y="40" font-family="Arial" font-size="12" fill="#ea4335" font-weight="bold">B(8, 6)</text>
  
  <!-- Midpoint M(5, 4) -->
  <circle cx="190" cy="110" r="6" fill="#34a853"/>
  <text x="200" y="105" font-family="Arial" font-size="12" fill="#34a853" font-weight="bold">M(5, 4)</text>
  
  <!-- Dashed lines to M coordinates -->
  <line x1="190" y1="110" x2="190" y2="230" stroke="#34a853" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="190" y1="110" x2="40" y2="110" stroke="#34a853" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- Formula -->
  <rect x="40" y="252" width="270" height="23" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="175" y="268" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">M = ((2+8)/2, (2+6)/2) = (5, 4)</text>
</svg>