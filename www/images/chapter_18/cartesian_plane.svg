<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 320">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#eee" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="350" height="320" fill="url(#grid)"/>
  
  <!-- Quadrant shading -->
  <rect x="175" y="30" width="145" height="130" fill="rgba(66, 133, 244, 0.1)"/>
  <rect x="35" y="30" width="140" height="130" fill="rgba(234, 67, 53, 0.1)"/>
  <rect x="35" y="160" width="140" height="130" fill="rgba(251, 188, 5, 0.1)"/>
  <rect x="175" y="160" width="145" height="130" fill="rgba(52, 168, 83, 0.1)"/>
  
  <!-- Axes -->
  <line x1="30" y1="160" x2="320" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="175" y1="290" x2="175" y2="30" stroke="#333" stroke-width="2"/>
  
  <!-- Arrows -->
  <polygon points="320,160 310,155 310,165" fill="#333"/>
  <polygon points="175,30 170,40 180,40" fill="#333"/>
  
  <!-- Axis labels -->
  <text x="325" y="165" font-family="Arial" font-size="14" fill="#333">x</text>
  <text x="170" y="25" font-family="Arial" font-size="14" fill="#333">y</text>
  <text x="165" y="175" font-family="Arial" font-size="12" fill="#333">O</text>
  
  <!-- Quadrant labels -->
  <text x="250" y="80" font-family="Arial" font-size="16" fill="#4285f4" font-weight="bold">I</text>
  <text x="250" y="100" font-family="Arial" font-size="11" fill="#4285f4">(+, +)</text>
  
  <text x="95" y="80" font-family="Arial" font-size="16" fill="#ea4335" font-weight="bold">II</text>
  <text x="95" y="100" font-family="Arial" font-size="11" fill="#ea4335">(-, +)</text>
  
  <text x="95" y="220" font-family="Arial" font-size="16" fill="#fbbc05" font-weight="bold">III</text>
  <text x="95" y="240" font-family="Arial" font-size="11" fill="#fbbc05">(-, -)</text>
  
  <text x="250" y="220" font-family="Arial" font-size="16" fill="#34a853" font-weight="bold">IV</text>
  <text x="250" y="240" font-family="Arial" font-size="11" fill="#34a853">(+, -)</text>
  
  <!-- Example point -->
  <circle cx="265" cy="70" r="5" fill="#333"/>
  <text x="275" y="75" font-family="Arial" font-size="12" fill="#333">(3, 3)</text>
  
  <circle cx="85" cy="70" r="5" fill="#333"/>
  <text x="50" y="75" font-family="Arial" font-size="12" fill="#333">(-3, 3)</text>
  
  <circle cx="85" cy="250" r="5" fill="#333"/>
  <text x="45" y="255" font-family="Arial" font-size="12" fill="#333">(-3, -3)</text>
  
  <circle cx="265" cy="250" r="5" fill="#333"/>
  <text x="275" y="255" font-family="Arial" font-size="12" fill="#333">(3, -3)</text>
  
  <!-- Title -->
  <text x="175" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">The Cartesian Plane and Its Quadrants</text>
</svg>