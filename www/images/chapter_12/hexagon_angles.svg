<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <!-- Regular Hexagon -->
  <polygon points="150,30 240,70 240,170 150,210 60,170 60,70" 
           fill="rgba(52, 168, 83, 0.2)" stroke="#34a853" stroke-width="2"/>
  
  <!-- Diagonal lines to show triangles -->
  <line x1="150" y1="30" x2="150" y2="210" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="60" y1="70" x2="240" y2="170" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="60" y1="170" x2="240" y2="70" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  
  <!-- Center point -->
  <circle cx="150" cy="120" r="3" fill="#333"/>
  
  <!-- Vertex labels -->
  <text x="150" y="20" font-family="Arial" font-size="14" text-anchor="middle">A</text>
  <text x="255" y="70" font-family="Arial" font-size="14">B</text>
  <text x="255" y="180" font-family="Arial" font-size="14">C</text>
  <text x="150" y="230" font-family="Arial" font-size="14" text-anchor="middle">D</text>
  <text x="45" y="180" font-family="Arial" font-size="14">E</text>
  <text x="45" y="70" font-family="Arial" font-size="14">F</text>
  
  <!-- Formula -->
  <text x="150" y="260" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">n = 6, Sum = (6-2) × 180° = 720°</text>
</svg>