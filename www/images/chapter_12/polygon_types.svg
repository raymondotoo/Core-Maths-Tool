<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <!-- Triangle -->
  <g transform="translate(50, 20)">
    <polygon points="50,10 10,90 90,90" fill="rgba(66, 133, 244, 0.3)" stroke="#4285f4" stroke-width="2"/>
    <text x="50" y="120" font-family="Arial" font-size="12" text-anchor="middle">Triangle (3)</text>
  </g>
  
  <!-- Quadrilateral -->
  <g transform="translate(150, 20)">
    <polygon points="20,20 80,10 90,80 10,90" fill="rgba(234, 67, 53, 0.3)" stroke="#ea4335" stroke-width="2"/>
    <text x="50" y="120" font-family="Arial" font-size="12" text-anchor="middle">Quadrilateral (4)</text>
  </g>
  
  <!-- Pentagon -->
  <g transform="translate(250, 20)">
    <polygon points="50,10 90,35 75,85 25,85 10,35" fill="rgba(251, 188, 5, 0.3)" stroke="#fbbc05" stroke-width="2"/>
    <text x="50" y="120" font-family="Arial" font-size="12" text-anchor="middle">Pentagon (5)</text>
  </g>
  
  <!-- Hexagon -->
  <g transform="translate(350, 20)">
    <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="rgba(52, 168, 83, 0.3)" stroke="#34a853" stroke-width="2"/>
    <text x="50" y="120" font-family="Arial" font-size="12" text-anchor="middle">Hexagon (6)</text>
  </g>
  
  <!-- Octagon -->
  <g transform="translate(450, 20)">
    <polygon points="30,10 70,10 90,30 90,70 70,90 30,90 10,70 10,30" fill="rgba(156, 39, 176, 0.3)" stroke="#9c27b0" stroke-width="2"/>
    <text x="50" y="120" font-family="Arial" font-size="12" text-anchor="middle">Octagon (8)</text>
  </g>
</svg>