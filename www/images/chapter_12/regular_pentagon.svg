<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <!-- Regular Pentagon -->
  <polygon points="150,30 250,90 210,200 90,200 50,90" 
           fill="rgba(251, 188, 5, 0.2)" stroke="#fbbc05" stroke-width="2"/>
  
  <!-- Interior angle arc at top -->
  <path d="M 150,30 L 130,55 A 30 30 0 0 1 170,55 L 150,30" fill="rgba(66,133,244,0.3)" stroke="#4285f4" stroke-width="2"/>
  <text x="150" y="75" font-family="Arial" font-size="13" fill="#4285f4" text-anchor="middle" font-weight="bold">108°</text>
  
  <!-- Exterior angle shown -->
  <line x1="150" y1="30" x2="150" y2="0" stroke="#ea4335" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="150" y1="30" x2="250" y2="90" stroke="#fbbc05" stroke-width="2"/>
  <path d="M 150,10 A 20 20 0 0 1 175,35" fill="none" stroke="#ea4335" stroke-width="2"/>
  <text x="175" y="20" font-family="Arial" font-size="12" fill="#ea4335" font-weight="bold">72°</text>
  
  <!-- Vertices -->
  <circle cx="150" cy="30" r="4" fill="#fbbc05"/>
  <circle cx="250" cy="90" r="4" fill="#fbbc05"/>
  <circle cx="210" cy="200" r="4" fill="#fbbc05"/>
  <circle cx="90" cy="200" r="4" fill="#fbbc05"/>
  <circle cx="50" cy="90" r="4" fill="#fbbc05"/>
  
  <!-- Labels -->
  <text x="150" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Regular Pentagon (n = 5)</text>
  <text x="150" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Exterior angle = 360°/5 = 72°</text>
</svg>