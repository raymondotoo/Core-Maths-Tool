<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280">
  <!-- Quadrilateral with angles 85°, 110°, 75°, 90° -->
  <polygon points="50,50 250,40 280,200 30,220" 
           fill="rgba(66, 133, 244, 0.2)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Angle arcs -->
  <!-- Angle A (85°) -->
  <path d="M 50,50 L 70,52 A 20 20 0 0 1 52,70 L 50,50" fill="rgba(234,67,53,0.3)" stroke="#ea4335"/>
  <text x="75" y="75" font-family="Arial" font-size="14" fill="#ea4335">85°</text>
  
  <!-- Angle B (110°) -->
  <path d="M 250,40 L 230,42 A 20 20 0 0 0 248,60 L 250,40" fill="rgba(251,188,5,0.3)" stroke="#fbbc05"/>
  <text x="215" y="70" font-family="Arial" font-size="14" fill="#fbbc05">110°</text>
  
  <!-- Angle C (75°) -->
  <path d="M 280,200 L 260,198 A 20 20 0 0 0 278,180 L 280,200" fill="rgba(52,168,83,0.3)" stroke="#34a853"/>
  <text x="235" y="185" font-family="Arial" font-size="14" fill="#34a853">75°</text>
  
  <!-- Angle D (unknown - x) -->
  <text x="55" y="205" font-family="Arial" font-size="16" fill="#9c27b0" font-weight="bold">x = ?</text>
  
  <!-- Vertex labels -->
  <text x="40" y="40" font-family="Arial" font-size="16" font-weight="bold">A</text>
  <text x="260" y="35" font-family="Arial" font-size="16" font-weight="bold">B</text>
  <text x="285" y="210" font-family="Arial" font-size="16" font-weight="bold">C</text>
  <text x="15" y="235" font-family="Arial" font-size="16" font-weight="bold">D</text>
  
  <!-- Sum -->
  <text x="160" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">85° + 110° + 75° + x = 360°</text>
</svg>