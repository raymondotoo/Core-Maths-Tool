<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350">
  <!-- Square -->
  <g transform="translate(30, 20)">
    <rect x="10" y="10" width="80" height="80" fill="rgba(66, 133, 244, 0.3)" stroke="#4285f4" stroke-width="2"/>
    <!-- Right angle marks -->
    <rect x="10" y="10" width="10" height="10" fill="none" stroke="#4285f4" stroke-width="1"/>
    <rect x="80" y="10" width="10" height="10" fill="none" stroke="#4285f4" stroke-width="1"/>
    <rect x="80" y="80" width="10" height="10" fill="none" stroke="#4285f4" stroke-width="1"/>
    <rect x="10" y="80" width="10" height="10" fill="none" stroke="#4285f4" stroke-width="1"/>
    <!-- Equal marks -->
    <line x1="45" y1="8" x2="55" y2="8" stroke="#4285f4" stroke-width="2"/>
    <line x1="45" y1="92" x2="55" y2="92" stroke="#4285f4" stroke-width="2"/>
    <line x1="8" y1="45" x2="8" y2="55" stroke="#4285f4" stroke-width="2"/>
    <line x1="92" y1="45" x2="92" y2="55" stroke="#4285f4" stroke-width="2"/>
    <text x="50" y="115" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Square</text>
  </g>
  
  <!-- Rectangle -->
  <g transform="translate(140, 20)">
    <rect x="0" y="20" width="100" height="60" fill="rgba(234, 67, 53, 0.3)" stroke="#ea4335" stroke-width="2"/>
    <!-- Right angle marks -->
    <rect x="0" y="20" width="8" height="8" fill="none" stroke="#ea4335" stroke-width="1"/>
    <rect x="92" y="20" width="8" height="8" fill="none" stroke="#ea4335" stroke-width="1"/>
    <rect x="92" y="72" width="8" height="8" fill="none" stroke="#ea4335" stroke-width="1"/>
    <rect x="0" y="72" width="8" height="8" fill="none" stroke="#ea4335" stroke-width="1"/>
    <text x="50" y="115" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Rectangle</text>
  </g>
  
  <!-- Rhombus -->
  <g transform="translate(260, 20)">
    <polygon points="50,5 95,50 50,95 5,50" fill="rgba(251, 188, 5, 0.3)" stroke="#fbbc05" stroke-width="2"/>
    <!-- Equal marks -->
    <line x1="68" y1="23" x2="77" y2="32" stroke="#fbbc05" stroke-width="2"/>
    <line x1="77" y1="68" x2="68" y2="77" stroke="#fbbc05" stroke-width="2"/>
    <line x1="23" y1="68" x2="32" y2="77" stroke="#fbbc05" stroke-width="2"/>
    <line x1="32" y1="23" x2="23" y2="32" stroke="#fbbc05" stroke-width="2"/>
    <text x="50" y="115" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Rhombus</text>
  </g>
  
  <!-- Parallelogram -->
  <g transform="translate(370, 20)">
    <polygon points="25,20 115,20 95,80 5,80" fill="rgba(52, 168, 83, 0.3)" stroke="#34a853" stroke-width="2"/>
    <!-- Parallel marks -->
    <line x1="65" y1="17" x2="75" y2="23" stroke="#34a853" stroke-width="2"/>
    <line x1="45" y1="77" x2="55" y2="83" stroke="#34a853" stroke-width="2"/>
    <text x="60" y="115" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Parallelogram</text>
  </g>
  
  <!-- Trapezium -->
  <g transform="translate(500, 20)">
    <polygon points="30,20 90,20 110,80 10,80" fill="rgba(156, 39, 176, 0.3)" stroke="#9c27b0" stroke-width="2"/>
    <!-- Parallel marks on top and bottom -->
    <line x1="55" y1="17" x2="65" y2="23" stroke="#9c27b0" stroke-width="2"/>
    <line x1="55" y1="77" x2="65" y2="83" stroke="#9c27b0" stroke-width="2"/>
    <text x="60" y="115" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Trapezium</text>
  </g>
  
  <!-- Kite -->
  <g transform="translate(30, 170)">
    <polygon points="50,5 90,50 50,120 10,50" fill="rgba(255, 152, 0, 0.3)" stroke="#ff9800" stroke-width="2"/>
    <!-- Equal marks for adjacent sides -->
    <line x1="65" y1="22" x2="75" y2="32" stroke="#ff9800" stroke-width="2"/>
    <line x1="25" y1="22" x2="35" y2="32" stroke="#ff9800" stroke-width="2"/>
    <line x1="65" y1="78" x2="75" y2="88" stroke="#ff9800" stroke-width="2"/>
    <line x1="63" y1="80" x2="73" y2="90" stroke="#ff9800" stroke-width="2"/>
    <line x1="25" y1="78" x2="35" y2="88" stroke="#ff9800" stroke-width="2"/>
    <line x1="27" y1="80" x2="37" y2="90" stroke="#ff9800" stroke-width="2"/>
    <text x="50" y="145" font-family="Arial" font-size="13" text-anchor="middle" font-weight="bold">Kite</text>
  </g>
</svg>