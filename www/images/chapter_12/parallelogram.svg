<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 220">
  <!-- Parallelogram ABCD -->
  <polygon points="80,50 280,50 250,170 50,170" 
           fill="rgba(66, 133, 244, 0.2)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Angle A (70°) -->
  <path d="M 80,50 L 105,50 A 25 25 0 0 1 90,72" fill="rgba(234,67,53,0.3)" stroke="#ea4335" stroke-width="2"/>
  <text x="105" y="78" font-family="Arial" font-size="14" fill="#ea4335" font-weight="bold">70°</text>
  
  <!-- Angle B (110°) -->
  <path d="M 280,50 L 255,50 A 25 25 0 0 0 268,72" fill="rgba(251,188,5,0.3)" stroke="#fbbc05" stroke-width="2"/>
  <text x="235" y="78" font-family="Arial" font-size="14" fill="#fbbc05" font-weight="bold">110°</text>
  
  <!-- Angle C (70°) -->
  <path d="M 250,170 L 225,170 A 25 25 0 0 0 238,148" fill="rgba(234,67,53,0.3)" stroke="#ea4335" stroke-width="2"/>
  <text x="205" y="155" font-family="Arial" font-size="14" fill="#ea4335" font-weight="bold">70°</text>
  
  <!-- Angle D (110°) -->
  <path d="M 50,170 L 75,170 A 25 25 0 0 1 62,148" fill="rgba(251,188,5,0.3)" stroke="#fbbc05" stroke-width="2"/>
  <text x="82" y="155" font-family="Arial" font-size="14" fill="#fbbc05" font-weight="bold">110°</text>
  
  <!-- Parallel marks on AB and DC -->
  <line x1="175" y1="45" x2="185" y2="55" stroke="#4285f4" stroke-width="2"/>
  <line x1="145" y1="165" x2="155" y2="175" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Parallel marks on AD and BC -->
  <line x1="60" y1="105" x2="72" y2="115" stroke="#4285f4" stroke-width="2"/>
  <line x1="62" y1="115" x2="74" y2="105" stroke="#4285f4" stroke-width="2"/>
  <line x1="258" y1="105" x2="270" y2="115" stroke="#4285f4" stroke-width="2"/>
  <line x1="260" y1="115" x2="272" y2="105" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Vertex labels -->
  <text x="75" y="40" font-family="Arial" font-size="16" font-weight="bold">A</text>
  <text x="285" y="40" font-family="Arial" font-size="16" font-weight="bold">B</text>
  <text x="255" y="190" font-family="Arial" font-size="16" font-weight="bold">C</text>
  <text x="40" y="190" font-family="Arial" font-size="16" font-weight="bold">D</text>
  
  <!-- Info -->
  <text x="165" y="210" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Parallelogram: Opposite angles equal, adjacent angles supplementary</text>
</svg>