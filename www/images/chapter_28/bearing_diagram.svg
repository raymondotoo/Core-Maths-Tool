<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350">
  <!-- Compass circles -->
  <circle cx="175" cy="175" r="120" fill="none" stroke="#ddd" stroke-width="1"/>
  <circle cx="175" cy="175" r="80" fill="none" stroke="#eee" stroke-width="1"/>
  <circle cx="175" cy="175" r="5" fill="#333"/>
  
  <!-- Cardinal directions -->
  <line x1="175" y1="175" x2="175" y2="40" stroke="#333" stroke-width="2"/>
  <text x="175" y="30" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">N</text>
  
  <line x1="175" y1="175" x2="175" y2="310" stroke="#ddd" stroke-width="1"/>
  <text x="175" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">S</text>
  
  <line x1="175" y1="175" x2="310" y2="175" stroke="#ddd" stroke-width="1"/>
  <text x="325" y="180" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">E</text>
  
  <line x1="175" y1="175" x2="40" y2="175" stroke="#ddd" stroke-width="1"/>
  <text x="25" y="180" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">W</text>
  
  <!-- Bearing line (060°) -->
  <line x1="175" y1="175" x2="278" y2="115" stroke="#4285f4" stroke-width="3"/>
  <circle cx="278" cy="115" r="6" fill="#ea4335"/>
  <text x="295" y="105" font-family="Arial" font-size="14" fill="#ea4335" font-weight="bold">B</text>
  
  <!-- Starting point label -->
  <text x="160" y="195" font-family="Arial" font-size="14" fill="#333" font-weight="bold">A</text>
  
  <!-- Bearing angle arc -->
  <path d="M 175,135 A 40 40 0 0 1 209,147" fill="none" stroke="#ea4335" stroke-width="2"/>
  <text x="200" y="130" font-family="Arial" font-size="14" fill="#ea4335" font-weight="bold">060°</text>
  
  <!-- Title -->
  <text x="175" y="20" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Bearing of B from A = 060°</text>
  
  <!-- Note -->
  <text x="175" y="340" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">Bearings are measured clockwise from North</text>
</svg>