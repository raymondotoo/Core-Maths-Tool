<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280">
  <!-- Right triangle -->
  <polygon points="50,230 280,230 50,80" fill="rgba(66, 133, 244, 0.15)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Right angle mark -->
  <rect x="50" y="210" width="20" height="20" fill="none" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Angle θ arc -->
  <path d="M 250,230 A 30 30 0 0 0 268,210" fill="none" stroke="#ea4335" stroke-width="2"/>
  <text x="235" y="215" font-family="Arial" font-size="16" fill="#ea4335" font-weight="bold">θ</text>
  
  <!-- Side labels -->
  <text x="165" y="255" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#34a853">Adjacent (adj)</text>
  <text x="25" y="160" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#fbbc05">Opposite (opp)</text>
  <text x="185" y="140" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#9c27b0">Hypotenuse (hyp)</text>
  
  <!-- Formulas -->
  <text x="320" y="40" font-family="Arial" font-size="13" text-anchor="end" fill="#333" font-weight="bold">SOH CAH TOA</text>
  <text x="320" y="65" font-family="Arial" font-size="12" text-anchor="end" fill="#666">sin θ = opp / hyp</text>
  <text x="320" y="85" font-family="Arial" font-size="12" text-anchor="end" fill="#666">cos θ = adj / hyp</text>
  <text x="320" y="105" font-family="Arial" font-size="12" text-anchor="end" fill="#666">tan θ = opp / adj</text>
</svg>