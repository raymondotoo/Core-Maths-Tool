<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 240">
  <!-- Trapezium -->
  <polygon points="100,60 220,60 280,160 40,160" fill="rgba(156, 39, 176, 0.1)" stroke="#9c27b0" stroke-width="2"/>
  
  <!-- Top parallel side (a) -->
  <line x1="100" y1="45" x2="220" y2="45" stroke="#333" stroke-width="1"/>
  <polygon points="100,45 110,42 110,48" fill="#333"/>
  <polygon points="220,45 210,42 210,48" fill="#333"/>
  <text x="160" y="38" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">8 cm (a)</text>
  
  <!-- Bottom parallel side (b) -->
  <line x1="40" y1="175" x2="280" y2="175" stroke="#333" stroke-width="1"/>
  <polygon points="40,175 50,172 50,178" fill="#333"/>
  <polygon points="280,175 270,172 270,178" fill="#333"/>
  <text x="160" y="192" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">12 cm (b)</text>
  
  <!-- Height -->
  <line x1="160" y1="60" x2="160" y2="160" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="295" y1="60" x2="295" y2="160" stroke="#333" stroke-width="1"/>
  <polygon points="295,60 292,70 298,70" fill="#333"/>
  <polygon points="295,160 292,150 298,150" fill="#333"/>
  <text x="308" y="115" font-family="Arial" font-size="12" fill="#4285f4" font-weight="bold">6 cm</text>
  <text x="308" y="128" font-family="Arial" font-size="10" fill="#666">(h)</text>
  
  <!-- Right angle markers -->
  <polyline points="160,145 175,145 175,160" fill="none" stroke="#666" stroke-width="1"/>
  <polyline points="160,60 175,60 175,75" fill="none" stroke="#666" stroke-width="1"/>
  
  <!-- Title -->
  <text x="160" y="20" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">Trapezium Area</text>
  
  <!-- Formula and result -->
  <rect x="40" y="200" width="270" height="35" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="175" y="217" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">Area = ½(a + b) × h = ½(8 + 12) × 6</text>
  <text x="175" y="232" font-family="Arial" font-size="12" text-anchor="middle" fill="#34a853" font-weight="bold">= 60 cm²</text>
</svg>