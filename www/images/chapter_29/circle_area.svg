<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 230">
  <!-- Circle -->
  <circle cx="140" cy="110" r="70" fill="rgba(66, 133, 244, 0.1)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Center point -->
  <circle cx="140" cy="110" r="3" fill="#333"/>
  <text x="130" y="105" font-family="Arial" font-size="10" fill="#333">O</text>
  
  <!-- Radius -->
  <line x1="140" y1="110" x2="210" y2="110" stroke="#ea4335" stroke-width="2"/>
  <text x="175" y="103" font-family="Arial" font-size="12" fill="#ea4335" font-weight="bold">r = 7 cm</text>
  
  <!-- Diameter indicator -->
  <line x1="70" y1="110" x2="210" y2="110" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="140" y="125" font-family="Arial" font-size="10" fill="#666">d = 14 cm</text>
  
  <!-- Circumference indicator (arc at top) -->
  <path d="M 70,110 A 70 70 0 1 1 210,110" fill="none" stroke="#34a853" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="140" y="30" font-family="Arial" font-size="11" text-anchor="middle" fill="#34a853">Circumference</text>
  
  <!-- Formula box -->
  <rect x="230" y="40" width="110" height="100" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="285" y="60" font-family="Arial" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">Formulas</text>
  <text x="240" y="80" font-family="Arial" font-size="10" fill="#333">C = 2πr = πd</text>
  <text x="240" y="98" font-family="Arial" font-size="10" fill="#333">A = πr²</text>
  <line x1="235" y1="108" x2="335" y2="108" stroke="#ddd" stroke-width="1"/>
  <text x="240" y="125" font-family="Arial" font-size="10" fill="#34a853" font-weight="bold">C = 44 cm</text>
  <text x="240" y="138" font-family="Arial" font-size="10" fill="#34a853" font-weight="bold">A = 154 cm²</text>
  
  <!-- Title -->
  <text x="140" y="205" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">Circle (π = 22/7)</text>
</svg>