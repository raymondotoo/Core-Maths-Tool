<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 220">
  <!-- Triangle -->
  <polygon points="50,180 250,180 150,50" fill="rgba(234, 67, 53, 0.1)" stroke="#ea4335" stroke-width="2"/>
  
  <!-- Base -->
  <line x1="50" y1="195" x2="250" y2="195" stroke="#333" stroke-width="1"/>
  <polygon points="50,195 60,192 60,198" fill="#333"/>
  <polygon points="250,195 240,192 240,198" fill="#333"/>
  <text x="150" y="212" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">10 cm (base)</text>
  
  <!-- Height -->
  <line x1="150" y1="50" x2="150" y2="180" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="135" y1="50" x2="135" y2="180" stroke="#333" stroke-width="1"/>
  <polygon points="135,50 132,60 138,60" fill="#333"/>
  <polygon points="135,180 132,170 138,170" fill="#333"/>
  <text x="115" y="120" font-family="Arial" font-size="12" fill="#4285f4" font-weight="bold" transform="rotate(-90, 115, 120)">6 cm (h)</text>
  
  <!-- Right angle marker -->
  <polyline points="150,165 165,165 165,180" fill="none" stroke="#666" stroke-width="1"/>
  
  <!-- Formula box -->
  <rect x="260" y="80" width="85" height="60" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="302" y="100" font-family="Arial" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">Area</text>
  <text x="302" y="118" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">= ½ × b × h</text>
  <text x="302" y="136" font-family="Arial" font-size="11" text-anchor="middle" fill="#34a853" font-weight="bold">= 30 cm²</text>
  
  <!-- Title -->
  <text x="150" y="25" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">Triangle Area</text>
</svg>