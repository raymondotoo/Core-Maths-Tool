<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 250">
  <!-- 3D Cuboid -->
  <!-- Front face -->
  <polygon points="40,100 160,100 160,200 40,200" fill="rgba(66, 133, 244, 0.2)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Top face -->
  <polygon points="40,100 100,50 220,50 160,100" fill="rgba(66, 133, 244, 0.3)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Right face -->
  <polygon points="160,100 220,50 220,150 160,200" fill="rgba(66, 133, 244, 0.15)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Dimensions -->
  <!-- Width (8 cm) -->
  <line x1="40" y1="215" x2="160" y2="215" stroke="#333" stroke-width="1"/>
  <polygon points="40,215 50,212 50,218" fill="#333"/>
  <polygon points="160,215 150,212 150,218" fill="#333"/>
  <text x="100" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">8 cm</text>
  
  <!-- Height (4 cm) -->
  <line x1="25" y1="100" x2="25" y2="200" stroke="#333" stroke-width="1"/>
  <polygon points="25,100 22,110 28,110" fill="#333"/>
  <polygon points="25,200 22,190 28,190" fill="#333"/>
  <text x="12" y="155" font-family="Arial" font-size="12" fill="#333" font-weight="bold">4 cm</text>
  
  <!-- Depth (5 cm) -->
  <line x1="165" y1="95" x2="225" y2="45" stroke="#333" stroke-width="1"/>
  <text x="200" y="65" font-family="Arial" font-size="12" fill="#333" font-weight="bold">5 cm</text>
  
  <!-- Formula box -->
  <rect x="230" y="80" width="115" height="90" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="287" y="98" font-family="Arial" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">Cuboid</text>
  <text x="240" y="118" font-family="Arial" font-size="10" fill="#333">V = l × w × h</text>
  <text x="240" y="133" font-family="Arial" font-size="10" fill="#34a853" font-weight="bold">= 160 cm³</text>
  <line x1="235" y1="143" x2="340" y2="143" stroke="#ddd"/>
  <text x="240" y="158" font-family="Arial" font-size="9" fill="#333">SA = 2(lw+lh+wh)</text>
  <text x="240" y="170" font-family="Arial" font-size="10" fill="#34a853" font-weight="bold">= 184 cm²</text>
</svg>