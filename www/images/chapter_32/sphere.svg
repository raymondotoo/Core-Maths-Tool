<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 250">
  <!-- Sphere (circle with shading) -->
  <circle cx="140" cy="120" r="80" fill="rgba(52, 168, 83, 0.15)" stroke="#34a853" stroke-width="2"/>
  
  <!-- Equator ellipse (dotted) -->
  <ellipse cx="140" cy="120" rx="80" ry="25" fill="none" stroke="#34a853" stroke-width="1" stroke-dasharray="4,3"/>
  
  <!-- Hidden back part of equator -->
  <ellipse cx="140" cy="120" rx="80" ry="25" fill="none" stroke="#34a853" stroke-width="1" stroke-dasharray="2,4" opacity="0.4"/>
  
  <!-- Center point -->
  <circle cx="140" cy="120" r="3" fill="#333"/>
  <text x="148" y="125" font-family="Arial" font-size="11" fill="#333" font-weight="bold">O</text>
  
  <!-- Radius -->
  <line x1="140" y1="120" x2="220" y2="120" stroke="#ea4335" stroke-width="2"/>
  <text x="175" y="112" font-family="Arial" font-size="12" fill="#ea4335" font-weight="bold">r</text>
  
  <!-- Radius to top -->
  <line x1="140" y1="120" x2="140" y2="40" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="145" y="80" font-family="Arial" font-size="11" fill="#666">r</text>
  
  <!-- Formula box -->
  <rect x="230" y="60" width="110" height="85" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="285" y="80" font-family="Arial" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">Sphere</text>
  <text x="240" y="100" font-family="Arial" font-size="10" fill="#333">V = ⁴⁄₃πr³</text>
  <text x="240" y="120" font-family="Arial" font-size="10" fill="#333">SA = 4πr²</text>
  <line x1="235" y1="130" x2="335" y2="130" stroke="#ddd"/>
  <text x="240" y="145" font-family="Arial" font-size="9" fill="#666">Hemisphere:</text>
  <text x="260" y="158" font-family="Arial" font-size="9" fill="#666">V = ²⁄₃πr³</text>
  
  <!-- Title -->
  <text x="175" y="235" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">Sphere</text>
</svg>