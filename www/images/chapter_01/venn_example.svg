<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280">
  <rect x="0" y="0" width="450" height="280" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  <text x="430" y="20" font-family="serif" font-size="14" font-style="italic">ξ</text>
  
  <!-- Set A -->
  <circle cx="160" cy="140" r="90" fill="rgba(66, 133, 244, 0.2)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Set B -->
  <circle cx="290" cy="140" r="90" fill="rgba(234, 67, 53, 0.2)" stroke="#ea4335" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="90" y="60" font-family="Arial" font-size="16" font-weight="bold" fill="#4285f4">A (Newspaper A)</text>
  <text x="280" y="60" font-family="Arial" font-size="16" font-weight="bold" fill="#ea4335">B (Newspaper B)</text>
  
  <!-- Numbers in regions -->
  <text x="110" y="145" font-family="Arial" font-size="28" text-anchor="middle" fill="#333">40</text>
  <text x="225" y="145" font-family="Arial" font-size="28" text-anchor="middle" fill="#333">20</text>
  <text x="340" y="145" font-family="Arial" font-size="28" text-anchor="middle" fill="#333">30</text>
  <text x="30" y="250" font-family="Arial" font-size="24" text-anchor="middle" fill="#666">10</text>
  
  <!-- Explanations -->
  <text x="110" y="170" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">only A</text>
  <text x="225" y="170" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">A ∩ B</text>
  <text x="340" y="170" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">only B</text>
  <text x="30" y="265" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">neither</text>
  
  <!-- Total label -->
  <text x="225" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Total = 100</text>
</svg>