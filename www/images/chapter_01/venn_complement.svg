<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <rect x="0" y="0" width="400" height="250" fill="rgba(66, 133, 244, 0.2)" stroke="#333" stroke-width="2"/>
  <text x="380" y="20" font-family="serif" font-size="14" font-style="italic">ξ</text>
  
  <!-- Set A (white/unfilled to show complement) -->
  <circle cx="200" cy="125" r="70" fill="#fff" stroke="#4285f4" stroke-width="2"/>
  <text x="200" y="130" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#4285f4">A</text>
  
  <!-- Label for complement -->
  <text x="60" y="50" font-family="Arial" font-size="16" fill="#333">A' (complement)</text>
  <text x="60" y="70" font-family="Arial" font-size="12" fill="#666">Shaded region</text>
</svg>