<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect x="0" y="0" width="400" height="300" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  <text x="380" y="20" font-family="serif" font-size="14" font-style="italic">ξ</text>
  
  <!-- Set A (top left) -->
  <circle cx="150" cy="120" r="80" fill="rgba(66, 133, 244, 0.3)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Set B (top right) -->
  <circle cx="250" cy="120" r="80" fill="rgba(234, 67, 53, 0.3)" stroke="#ea4335" stroke-width="2"/>
  
  <!-- Set C (bottom center) -->
  <circle cx="200" cy="200" r="80" fill="rgba(251, 188, 5, 0.3)" stroke="#fbbc05" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="90" y="90" font-family="Arial" font-size="20" font-weight="bold" fill="#4285f4">A</text>
  <text x="290" y="90" font-family="Arial" font-size="20" font-weight="bold" fill="#ea4335">B</text>
  <text x="200" y="265" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#fbbc05">C</text>
  
  <!-- Region labels -->
  <text x="200" y="100" font-family="Arial" font-size="10" text-anchor="middle">A∩B</text>
  <text x="145" y="175" font-family="Arial" font-size="10" text-anchor="middle">A∩C</text>
  <text x="255" y="175" font-family="Arial" font-size="10" text-anchor="middle">B∩C</text>
  <text x="200" y="155" font-family="Arial" font-size="9" text-anchor="middle">A∩B∩C</text>
</svg>