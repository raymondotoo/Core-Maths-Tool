<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f5f5f5" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="320" height="300" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="30" y1="150" x2="290" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="280" x2="160" y2="20" stroke="#333" stroke-width="2"/>
  
  <!-- Arrows -->
  <polygon points="290,150 280,145 280,155" fill="#333"/>
  <polygon points="160,20 155,30 165,30" fill="#333"/>
  
  <!-- Labels -->
  <text x="295" y="155" font-family="Arial" font-size="12" fill="#333">x</text>
  <text x="155" y="15" font-family="Arial" font-size="12" fill="#333">y</text>
  <text x="168" y="165" font-family="Arial" font-size="10" fill="#333">O</text>
  
  <!-- Center point -->
  <circle cx="160" cy="150" r="4" fill="#333"/>
  
  <!-- Original point P(3, 2) at (250, 90) -->
  <circle cx="250" cy="90" r="5" fill="#4285f4"/>
  <text x="260" y="85" font-family="Arial" font-size="12" fill="#4285f4" font-weight="bold">P(3, 2)</text>
  
  <!-- Line from O to P -->
  <line x1="160" y1="150" x2="250" y2="90" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Rotated point P'(-2, 3) at (100, 60) - 90° counterclockwise -->
  <circle cx="100" cy="60" r="5" fill="#34a853"/>
  <text x="55" y="55" font-family="Arial" font-size="12" fill="#34a853" font-weight="bold">P'(-2, 3)</text>
  
  <!-- Line from O to P' -->
  <line x1="160" y1="150" x2="100" y2="60" stroke="#34a853" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Rotation arc -->
  <path d="M 215,115 A 70 70 0 0 0 135,95" fill="none" stroke="#ea4335" stroke-width="2"/>
  <polygon points="135,95 148,90 145,103" fill="#ea4335"/>
  <text x="185" y="80" font-family="Arial" font-size="14" fill="#ea4335" font-weight="bold">90°</text>
  
  <!-- Legend -->
  <rect x="35" y="200" width="130" height="70" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="100" y="218" font-family="Arial" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">90° CCW Rotation:</text>
  <text x="45" y="238" font-family="Arial" font-size="10" fill="#333">(x, y) → (-y, x)</text>
  <text x="45" y="258" font-family="Arial" font-size="10" fill="#333">(3, 2) → (-2, 3)</text>
  
  <!-- Title -->
  <text x="160" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">90° Counterclockwise Rotation about Origin</text>
</svg>