<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#eee" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="350" height="280" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="50" y1="200" x2="310" y2="200" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="200" x2="50" y2="30" stroke="#333" stroke-width="1.5"/>
  
  <!-- Arrows -->
  <polygon points="310,200 300,195 300,205" fill="#333"/>
  <polygon points="50,30 45,40 55,40" fill="#333"/>
  
  <!-- Labels -->
  <text x="315" y="205" font-family="Arial" font-size="11" fill="#333">x</text>
  <text x="45" y="25" font-family="Arial" font-size="11" fill="#333">y</text>
  
  <!-- Original point P(3, 5) at scaled position (140, 50) -->
  <circle cx="140" cy="50" r="6" fill="#4285f4"/>
  <text x="110" y="45" font-family="Arial" font-size="12" fill="#4285f4" font-weight="bold">P(3, 5)</text>
  
  <!-- Translation vector arrow -->
  <line x1="140" y1="50" x2="260" y2="110" stroke="#ea4335" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="260,110 248,100 245,113" fill="#ea4335"/>
  
  <!-- Image point P'(7, 3) -->
  <circle cx="260" cy="110" r="6" fill="#34a853"/>
  <text x="270" y="115" font-family="Arial" font-size="12" fill="#34a853" font-weight="bold">P'(7, 3)</text>
  
  <!-- Translation vector label -->
  <text x="185" y="60" font-family="Arial" font-size="12" fill="#ea4335" font-weight="bold">
    <tspan>T = </tspan>
  </text>
  <text x="210" y="53" font-family="Arial" font-size="11" fill="#ea4335">(4)</text>
  <text x="210" y="73" font-family="Arial" font-size="11" fill="#ea4335">(-2)</text>
  <line x1="205" y1="45" x2="205" y2="78" stroke="#ea4335" stroke-width="1"/>
  <line x1="223" y1="45" x2="223" y2="78" stroke="#ea4335" stroke-width="1"/>
  
  <!-- Vector components shown -->
  <line x1="140" y1="50" x2="260" y2="50" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="200" y="45" font-family="Arial" font-size="10" fill="#9c27b0">+4</text>
  
  <line x1="260" y1="50" x2="260" y2="110" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="265" y="85" font-family="Arial" font-size="10" fill="#9c27b0">-2</text>
  
  <!-- Formula box -->
  <rect x="50" y="225" width="250" height="45" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="175" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Translation</text>
  <text x="175" y="262" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">(x, y) → (x + a, y + b)</text>
</svg>