<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- Smaller triangle -->
  <polygon points="50,170 110,170 80,100" fill="rgba(66, 133, 244, 0.15)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Labels for small triangle -->
  <text x="55" y="165" font-family="Arial" font-size="11" fill="#333" font-weight="bold">P</text>
  <text x="103" y="165" font-family="Arial" font-size="11" fill="#333" font-weight="bold">Q</text>
  <text x="78" y="93" font-family="Arial" font-size="11" fill="#333" font-weight="bold">R</text>
  
  <!-- Side labels for small -->
  <text x="80" y="183" font-family="Arial" font-size="10" fill="#4285f4">6 cm</text>
  <text x="50" y="130" font-family="Arial" font-size="10" fill="#4285f4" transform="rotate(-55, 50, 130)">8 cm</text>
  <text x="100" y="130" font-family="Arial" font-size="10" fill="#4285f4" transform="rotate(55, 100, 130)">10 cm</text>
  
  <!-- Larger similar triangle -->
  <polygon points="200,170 290,170 245,65" fill="rgba(52, 168, 83, 0.15)" stroke="#34a853" stroke-width="2"/>
  
  <!-- Labels for large triangle -->
  <text x="193" y="165" font-family="Arial" font-size="11" fill="#333" font-weight="bold">X</text>
  <text x="288" y="165" font-family="Arial" font-size="11" fill="#333" font-weight="bold">Y</text>
  <text x="243" y="58" font-family="Arial" font-size="11" fill="#333" font-weight="bold">Z</text>
  
  <!-- Side labels for large -->
  <text x="245" y="183" font-family="Arial" font-size="10" fill="#34a853">9 cm</text>
  <text x="195" y="115" font-family="Arial" font-size="10" fill="#34a853" transform="rotate(-55, 195, 115)">12 cm</text>
  <text x="280" y="115" font-family="Arial" font-size="10" fill="#34a853" transform="rotate(55, 280, 115)">15 cm</text>
  
  <!-- Similarity symbol -->
  <text x="155" y="120" font-family="Arial" font-size="24" fill="#666">∼</text>
  
  <!-- Formula box -->
  <rect x="305" y="70" width="70" height="70" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="340" y="90" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">Scale Factor</text>
  <text x="340" y="108" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">9/6 = 1.5</text>
  <text x="340" y="123" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">12/8 = 1.5</text>
  <text x="340" y="138" font-family="Arial" font-size="10" text-anchor="middle" fill="#34a853" font-weight="bold">k = 1.5</text>
  
  <!-- Title -->
  <text x="175" y="30" font-family="Arial" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">Similar Triangles (Same Angles, Proportional Sides)</text>
</svg>