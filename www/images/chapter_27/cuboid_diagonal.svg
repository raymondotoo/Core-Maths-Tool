<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280">
  <!-- 3D Cuboid -->
  <!-- Front face -->
  <polygon points="80,180 200,180 200,80 80,80" fill="rgba(66, 133, 244, 0.2)" stroke="#4285f4" stroke-width="2"/>
  <!-- Top face -->
  <polygon points="80,80 200,80 260,40 140,40" fill="rgba(66, 133, 244, 0.3)" stroke="#4285f4" stroke-width="2"/>
  <!-- Right face -->
  <polygon points="200,80 260,40 260,140 200,180" fill="rgba(66, 133, 244, 0.15)" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Space diagonal -->
  <line x1="80" y1="180" x2="260" y2="40" stroke="#ea4335" stroke-width="3" stroke-dasharray="8,4"/>
  
  <!-- Base diagonal (helper) -->
  <line x1="80" y1="180" x2="260" y2="140" stroke="#fbbc05" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Dimension labels -->
  <text x="140" y="200" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">4 cm</text>
  <text x="65" y="135" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">5 cm</text>
  <text x="235" y="175" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">3 cm</text>
  
  <!-- Diagonal label -->
  <text x="185" y="95" font-family="Arial" font-size="16" font-weight="bold" fill="#ea4335">D = ?</text>
  
  <!-- Formula -->
  <text x="175" y="240" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">D² = 3² + 4² + 5²</text>
  <text x="175" y="258" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">Space diagonal of cuboid</text>
</svg>