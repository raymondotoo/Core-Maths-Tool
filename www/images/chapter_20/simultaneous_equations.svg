<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 300">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eee" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="350" height="300" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="30" y1="200" x2="320" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="280" x2="70" y2="30" stroke="#333" stroke-width="2"/>
  
  <!-- Arrows -->
  <polygon points="320,200 310,195 310,205" fill="#333"/>
  <polygon points="70,30 65,40 75,40" fill="#333"/>
  
  <!-- Labels -->
  <text x="325" y="205" font-family="Arial" font-size="12" fill="#333">x</text>
  <text x="65" y="25" font-family="Arial" font-size="12" fill="#333">y</text>
  
  <!-- Grid marks -->
  <text x="110" y="215" font-family="Arial" font-size="10" fill="#666">1</text>
  <text x="150" y="215" font-family="Arial" font-size="10" fill="#666">2</text>
  <text x="190" y="215" font-family="Arial" font-size="10" fill="#666">3</text>
  
  <text x="55" y="164" font-family="Arial" font-size="10" fill="#666">1</text>
  <text x="55" y="124" font-family="Arial" font-size="10" fill="#666">2</text>
  <text x="55" y="84" font-family="Arial" font-size="10" fill="#666">3</text>
  <text x="55" y="44" font-family="Arial" font-size="10" fill="#666">4</text>
  
  <!-- Line 1: y = x + 1 -->
  <!-- At x=0, y=1; x=1, y=2; x=2, y=3; x=3, y=4 -->
  <line x1="30" y1="180" x2="230" y2="20" stroke="#4285f4" stroke-width="3"/>
  <text x="185" y="60" font-family="Arial" font-size="12" fill="#4285f4" font-weight="bold">y = x + 1</text>
  
  <!-- Line 2: y = -2x + 4 -->
  <!-- At x=0, y=4; x=1, y=2; x=2, y=0 -->
  <line x1="70" y1="40" x2="230" y2="200" stroke="#ea4335" stroke-width="3"/>
  <text x="235" y="165" font-family="Arial" font-size="12" fill="#ea4335" font-weight="bold">y = -2x + 4</text>
  
  <!-- Intersection point (1, 2) -->
  <circle cx="110" cy="120" r="7" fill="#34a853"/>
  <text x="120" y="115" font-family="Arial" font-size="12" fill="#34a853" font-weight="bold">(1, 2)</text>
  
  <!-- Dashed lines to axes -->
  <line x1="110" y1="120" x2="110" y2="200" stroke="#34a853" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="110" y1="120" x2="70" y2="120" stroke="#34a853" stroke-width="1.5" stroke-dasharray="5,3"/>
  
  <!-- Solution box -->
  <rect x="200" y="220" width="140" height="55" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="270" y="240" font-family="Arial" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">Solution:</text>
  <text x="270" y="258" font-family="Arial" font-size="11" text-anchor="middle" fill="#34a853">x = 1, y = 2</text>
  <text x="270" y="272" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(Point of intersection)</text>
</svg>