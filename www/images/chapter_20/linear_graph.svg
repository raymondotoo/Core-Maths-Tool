<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 300">
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#eee" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="350" height="300" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="30" y1="150" x2="320" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="175" y1="280" x2="175" y2="20" stroke="#333" stroke-width="2"/>
  
  <!-- Arrows -->
  <polygon points="320,150 310,145 310,155" fill="#333"/>
  <polygon points="175,20 170,30 180,30" fill="#333"/>
  
  <!-- Labels -->
  <text x="325" y="155" font-family="Arial" font-size="12" fill="#333">x</text>
  <text x="170" y="15" font-family="Arial" font-size="12" fill="#333">y</text>
  <text x="165" y="165" font-family="Arial" font-size="10" fill="#333">O</text>
  
  <!-- Grid marks -->
  <text x="115" y="165" font-family="Arial" font-size="9" fill="#666">-2</text>
  <text x="145" y="165" font-family="Arial" font-size="9" fill="#666">-1</text>
  <text x="205" y="165" font-family="Arial" font-size="9" fill="#666">1</text>
  <text x="235" y="165" font-family="Arial" font-size="9" fill="#666">2</text>
  <text x="265" y="165" font-family="Arial" font-size="9" fill="#666">3</text>
  
  <text x="163" y="123" font-family="Arial" font-size="9" fill="#666">1</text>
  <text x="163" y="93" font-family="Arial" font-size="9" fill="#666">2</text>
  <text x="163" y="63" font-family="Arial" font-size="9" fill="#666">3</text>
  <text x="158" y="177" font-family="Arial" font-size="9" fill="#666">-1</text>
  <text x="158" y="207" font-family="Arial" font-size="9" fill="#666">-2</text>
  <text x="158" y="237" font-family="Arial" font-size="9" fill="#666">-3</text>
  
  <!-- Line y = 2x + 1 -->
  <!-- Points: (-2,-3), (-1,-1), (0,1), (1,3), (2,5), (3,7) -->
  <!-- Scaled: x=-2 at 115, x=3 at 265; y=1 at 120, each unit = ~30 -->
  <line x1="70" y1="240" x2="290" y2="0" stroke="#4285f4" stroke-width="3"/>
  
  <!-- Key points -->
  <circle cx="115" cy="240" r="4" fill="#ea4335"/>
  <circle cx="145" cy="180" r="4" fill="#ea4335"/>
  <circle cx="175" cy="120" r="4" fill="#ea4335"/>
  <circle cx="205" cy="60" r="4" fill="#ea4335"/>
  
  <!-- y-intercept highlight -->
  <circle cx="175" cy="120" r="6" fill="none" stroke="#34a853" stroke-width="2"/>
  <text x="185" y="115" font-family="Arial" font-size="10" fill="#34a853">(0, 1)</text>
  
  <!-- Gradient indicator -->
  <line x1="175" y1="120" x2="205" y2="120" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="205" y1="120" x2="205" y2="60" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="188" y="135" font-family="Arial" font-size="9" fill="#9c27b0">1</text>
  <text x="210" y="95" font-family="Arial" font-size="9" fill="#9c27b0">2</text>
  
  <!-- Label -->
  <text x="280" y="45" font-family="Arial" font-size="14" fill="#4285f4" font-weight="bold">y = 2x + 1</text>
  
  <!-- Legend -->
  <rect x="35" y="30" width="100" height="45" fill="rgba(255,255,255,0.95)" stroke="#ddd" rx="3"/>
  <text x="85" y="48" font-family="Arial" font-size="10" text-anchor="middle" fill="#333" font-weight="bold">m = 2 (gradient)</text>
  <text x="85" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">c = 1 (y-intercept)</text>
</svg>